[package]
name = "gitspark"
version = "0.8.2"
edition = "2024"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"
rust-embed = "8"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ureq = { version = "3.1", features = ["json"] }
regex = "1.12.3"
syntect = "5.3.0"
once_cell = "1.21.3"
open = "5.3.3"
# OS-level filesystem watching (FSEvents / inotify / ReadDirectoryChangesW).
notify = "8"
# Auto-update. The manifest is Ed25519-signed and the public key is compiled
# in, so a compromised host cannot point the updater at a hostile artifact.
semver = { version = "1", features = ["serde"] }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# Read-path git backend. Writes stay on the `git` binary — see
# examples/git_backends.rs for the benchmark this choice rests on.
gix = { version = "0.86", features = ["status", "revision"] }
two-face = "0.5.2"

[build-dependencies]
embed-resource = "3.0"

# --- Build profiles -----------------------------------------------------------
# GPUI pulls in a very large dependency graph, so the profiles below trade
# debug fidelity we do not use for link time and artifact size. See design.md
# §14 for the reasoning behind each knob.

[profile.dev]
opt-level = 1
# Full DWARF for our own crate costs seconds per link and hundreds of MB on
# disk. Line tables keep backtraces and panic locations usable.
debug = "line-tables-only"
# Keep debug info in the .o files instead of running dsymutil on every build.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
# We never step into gpui/syntect/regex — their debug info is dead weight.
debug = false

[profile.test]
debug = "line-tables-only"
lto = "off"

[profile.release]
opt-level = 3
# Thin LTO: most of the cross-crate inlining of fat LTO, but parallel across
# codegen units, so release links in a fraction of the time.
lto = "thin"
codegen-units = 16
strip = true
incremental = false

# Benchmark-only. These back examples/git_backends.rs, which compares the
# shell-out we ship against libgit2 and gitoxide on the operations the app
# actually performs. Not linked into the binary.
[dev-dependencies]
# Benchmark-only, backing examples/git_backends.rs.
git2 = "0.21"
