name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      # Without this, sccache has no persistent backend at all — it falls
      # back to the runner's local disk, which is thrown away with the VM at
      # the end of the job. This is what actually makes it survive between
      # runs: verified against a real run afterward, not assumed from the
      # docs — `sccache --show-stats` reported a local-disk cache location
      # and a near-zero hit rate the whole time this was missing.
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: windows-x64
            os: windows-2025
          - label: windows-arm64
            os: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same reasoning as the release workflow: GPUI's dependency graph is
      # large and stable, so rebuilding it from scratch on every push is the
      # bulk of a CI run.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-ci-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-target-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      # A fresh CI runner has no git identity at all, unlike every real
      # dev machine (git refuses to let you commit without one, so anyone
      # who has ever committed already has this set). Without it,
      # `create_repository_with_options`'s initial commit — which has no
      # opportunity to set a local identity first, since it creates the
      # repo itself — fails with "Author identity unknown".
      #
      # Git for Windows also ships with core.autocrlf=true by default, unlike
      # Linux/macOS — several tests write a file with an explicit "\n", clone
      # or check it out, and compare the checked-out bytes back against what
      # they wrote; autocrlf silently turned that into "\r\n" on Windows only.
      # Pinning it off keeps working-tree bytes identical across platforms.
      - name: Configure a git identity for the test suite
        run: |
          git config --global user.name "GitSpark CI"
          git config --global user.email "ci@gitspark.local"
          git config --global core.autocrlf false

      - name: Test all targets
        run: cargo test --all-targets --locked

  # release.yml only ever triggers on a tag push, and GitHub Actions only
  # shares a cache with the same branch or the repository's default branch —
  # a tag is neither, so one release's cache was invisible to the next one,
  # forever. Every release rebuilt GPUI's entire dependency graph from
  # nothing: confirmed against a real run, not assumed — v0.7.0's cache save
  # reported success and v0.8.0's restore still logged "Cache not found" for
  # both the exact key and the restore-key prefix.
  #
  # This job populates that same cache — same key format, same targets — but
  # on master, the one ref a tag push can actually inherit from. It has to be
  # a real `cargo build --release`, not the cheaper `cargo check`: tried
  # that first, and confirmed by hand that it doesn't work — `cargo check`
  # only emits metadata for dependencies, not the compiled rlibs a later
  # `cargo build` can actually link against, so a build straight after a
  # from-scratch check still recompiled everything. A build straight after a
  # matching build, by contrast, finished in about a second.
  warm-release-cache:
    name: Warm release cache ${{ matrix.label }}
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-universal
            os: macos-15
            target: universal2-apple-darwin
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Same key format as release.yml's build job, deliberately — this is
      # what lets that job's restore-keys fall back to what gets saved here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Warm the release build
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Warm the release build (both macOS arches)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  e2e-syntax:
    name: E2E syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check E2E scripts
        run: |
          node --check e2e/gitspark.mjs
          node --check e2e/selector-smoke.mjs
          node --check e2e/full-suite.mjs
          node --check e2e/gitea-suite.mjs
          node --check e2e/gui-handoff-linux-suite.mjs
          node --check e2e/gui-handoff-windows-suite.mjs
          for file in e2e/suites/*.mjs e2e/support/*.mjs; do
            node --check "$file"
          done

  e2e-native:
    name: Native E2E linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # sccache was installed here already but never wired up — nothing set
      # it as the compiler wrapper, so it sat idle the whole time.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            xvfb \
            libgl1-mesa-dri \
            mesa-vulkan-drivers

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same reasoning as the release workflow: GPUI's dependency graph is
      # large and stable, so rebuilding it from scratch on every push is the
      # bulk of a CI run.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-ci-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-target-

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # See the identical step in the `rust` job: repository-create-clone.mjs
      # exercises the "create repository with initial commit" path, which
      # needs a git identity that a fresh runner doesn't have.
      - name: Configure a git identity for the E2E suite
        run: |
          git config --global user.name "GitSpark CI"
          git config --global user.email "ci@gitspark.local"

      - name: Build native app for E2E
        run: cargo build --locked

      - name: Run native full-suite E2E
        run: xvfb-run -a node e2e/full-suite.mjs

  e2e-gitea:
    name: Native E2E (Gitea)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same image and settings as docker-compose.gitea.yml — kept in sync by
    # hand, since a services: container can't reference a compose file.
    # Port 3050 avoids colliding with Gitea's own default (3000) the way the
    # local compose file does.
    services:
      gitea:
        image: gitea/gitea:1.22
        ports:
          - 3050:3000
        env:
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__database__DB_TYPE: sqlite3
          GITEA__server__DOMAIN: localhost
          GITEA__server__HTTP_PORT: 3000
          GITEA__server__ROOT_URL: http://localhost:3050/
          GITEA__service__DISABLE_REGISTRATION: "false"
          GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
          GITEA__log__LEVEL: Warn
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            xvfb \
            libgl1-mesa-dri \
            mesa-vulkan-drivers

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-ci-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-target-

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure a git identity for the E2E suite
        run: |
          git config --global user.name "GitSpark CI"
          git config --global user.email "ci@gitspark.local"

      - name: Build native app for E2E
        run: cargo build --locked

      - name: Run Gitea-backed native E2E
        run: xvfb-run -a node e2e/gitea-suite.mjs

  e2e-gui-handoff-linux:
    name: Native E2E (GUI handoff, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build the real-desktop test image
        run: docker build -t gitspark-e2e-linux-desktop docker/e2e-linux-desktop

      # The image builds and runs the app *inside* the container (it needs
      # the container's own Xvfb/window-manager/MIME setup) — these two
      # caches are bind-mounted over the image's own cargo/target
      # directories at run time, the same registry/target split every other
      # job here uses, just reaching into the container instead of the
      # runner's native paths.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: docker-cargo-registry
          key: ${{ runner.os }}-gui-handoff-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gui-handoff-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: docker-target
          key: ${{ runner.os }}-gui-handoff-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gui-handoff-target-

      - name: Run the GUI handoff suite in the real-desktop image
        run: |
          mkdir -p docker-cargo-registry docker-target
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$PWD/docker-cargo-registry":/usr/local/cargo/registry \
            -v "$PWD/docker-target":/workspace/target \
            gitspark-e2e-linux-desktop

  e2e-gui-handoff-windows:
    name: Native E2E (GUI handoff, Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-ci-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-target-

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure a git identity for the E2E suite
        run: |
          git config --global user.name "GitSpark CI"
          git config --global user.email "ci@gitspark.local"
          git config --global core.autocrlf false

      - name: Build native app for E2E
        run: cargo build --locked

      - name: Run GUI handoff native E2E
        run: node e2e/gui-handoff-windows-suite.mjs
