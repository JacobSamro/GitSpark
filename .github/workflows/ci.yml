name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: windows-x64
            os: windows-2025
          - label: windows-arm64
            os: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Test all targets
        run: cargo test --all-targets --locked

  e2e-syntax:
    name: E2E syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check E2E scripts
        run: |
          node --check e2e/gitspark.mjs
          node --check e2e/selector-smoke.mjs
          node --check e2e/full-suite.mjs

  e2e-native:
    name: Native E2E linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            xvfb \
            libgl1-mesa-dri \
            mesa-vulkan-drivers

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build native app for E2E
        run: cargo build --locked

      - name: Run native full-suite E2E
        run: xvfb-run -a node e2e/full-suite.mjs
