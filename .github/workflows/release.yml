name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: gitspark
  APP_DISPLAY_NAME: GitSpark
  MACOS_BUNDLE_ID: com.github.samro.gitspark

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$tag" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      # sccache caches compiled crates ACROSS releases; the cargo caches above
      # only avoid re-downloading and re-linking. Incremental is off because it
      # is useless for a clean release build and only bloats the cache.
      #
      # SCCACHE_GHA_ENABLED was missing for every release through v0.8.0: with
      # no backend configured, sccache fell back to the runner's local disk,
      # which dies with the VM — the comment above described the intent, not
      # what was actually happening. A tag's own cache scope is still
      # invisible to every other tag regardless (GitHub Actions only shares a
      # cache with the same branch or the default branch, and a tag is
      # neither), which is what the ci.yml warm-release-cache job exists to
      # work around — it populates this exact cache under this exact key on
      # master, the one ref a tag push can actually inherit from.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: gitspark
            archive_ext: tar.gz
          - label: macos-universal
            os: macos-15
            target: universal2-apple-darwin
            binary: gitspark
            archive_ext: dmg
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: gitspark.exe
            archive_ext: exe
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      # A release built every dependency from scratch on all three platforms,
      # which is most of an 18-minute run. GPUI's graph is very large and
      # almost never changes between releases, so it is exactly what a cache
      # is for.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Keyed on the lockfile: a dependency change should miss, anything
          # else should hit. The restore-key means even a miss starts from the
          # previous release's registry rather than an empty one.
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

          mkdir -p target/universal2-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/${{ matrix.binary }} \
            target/aarch64-apple-darwin/release/${{ matrix.binary }} \
            -output target/universal2-apple-darwin/release/${{ matrix.binary }}
          lipo -info target/universal2-apple-darwin/release/${{ matrix.binary }}

      # After both build steps, not between them: sitting in the middle meant
      # the macOS job reported its stats before compiling anything and always
      # printed zero.
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          archive_base="${APP_NAME}-${RELEASE_TAG}-${TARGET}"
          stage_root="dist/${archive_base}"
          mkdir -p "$stage_root"
          cp "target/${TARGET}/release/${BIN_NAME}" "$stage_root/"
          if [[ -f README.md ]]; then
            cp README.md "$stage_root/"
          fi
          tar -C dist -czf "dist/${archive_base}.${ARCHIVE_EXT}" "${archive_base}"
          rm -rf "$stage_root"

      - name: Package macOS app bundle and DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary }}
        run: |
          version="${RELEASE_TAG#v}"
          archive_base="${APP_NAME}-${RELEASE_TAG}-${TARGET}"
          app_bundle_name="${APP_DISPLAY_NAME}.app"
          bundle_root="dist/${archive_base}/${app_bundle_name}"
          contents_dir="${bundle_root}/Contents"
          macos_dir="${contents_dir}/MacOS"
          resources_dir="${contents_dir}/Resources"
          dmg_root="dist/dmg-root"

          mkdir -p "$macos_dir" "$resources_dir" "$dmg_root"
          cp "target/${TARGET}/release/${BIN_NAME}" "${macos_dir}/${BIN_NAME}"
          chmod +x "${macos_dir}/${BIN_NAME}"

          # The bundle had no icon at all, so macOS drew the generic blank
          # document in the Dock and the Finder. Build a real .icns from the
          # source art: an iconset is a directory of fixed sizes, and iconutil
          # turns it into the single file the bundle references.
          if [[ -f assets/gitspark.png ]]; then
            iconset="$(mktemp -d)/${APP_DISPLAY_NAME}.iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z $size $size assets/gitspark.png \
                --out "$iconset/icon_${size}x${size}.png" >/dev/null
              # Every size needs its @2x twin or the Dock picks a blurry one.
              sips -z $((size * 2)) $((size * 2)) assets/gitspark.png \
                --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            iconutil -c icns "$iconset" -o "${resources_dir}/${APP_DISPLAY_NAME}.icns"
          else
            echo "::warning::assets/gitspark.png missing; bundling without an icon"
          fi

          cat > "${contents_dir}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleExecutable</key>
            <string>${BIN_NAME}</string>
            <key>CFBundleIconFile</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>${MACOS_BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          cp -R "$bundle_root" "$dmg_root/"
          if [[ -f README.md ]]; then
            cp README.md "$dmg_root/"
          fi
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create \
            -volname "${APP_DISPLAY_NAME}" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "dist/${archive_base}.dmg"

          file "dist/${archive_base}.dmg"
          rm -rf "dist/${archive_base}" "$dmg_root"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary }}
        run: |
          # Windows ships as an installer, same as macOS ships a .dmg — no
          # portable zip. The staging directory is left in place (not zipped)
          # for the installer step below, which needs a plain directory to
          # point Inno Setup's SourceDir at.
          $archiveBase = "$env:APP_NAME-$env:RELEASE_TAG-$env:TARGET"
          $stageRoot = Join-Path "dist" $archiveBase
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Copy-Item "target\$env:TARGET\release\$env:BIN_NAME" $stageRoot

          # Bare exe — this is what the signed update manifest points at, so
          # apply::install_windows's `fs::copy(artifact, exe)` gets a real
          # executable rather than an archive.
          Copy-Item (Join-Path $stageRoot $env:BIN_NAME) (Join-Path "dist" "$archiveBase.exe")
          echo "STAGE_ROOT=$stageRoot" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $isccDir) {
            echo "$isccDir" >> $env:GITHUB_PATH
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $bareVersion = $env:RELEASE_TAG.TrimStart('v')
          $setupName = "$env:APP_NAME-$env:RELEASE_TAG-$env:TARGET-Setup.exe"
          $expectedOutput = "installer\windows\Output\gitspark-setup.exe"
          # Inno Setup resolves a relative SourceDir against the .iss file's
          # own directory, not the process's working directory — an absolute
          # path avoids that mismatch.
          $sourceDir = (Resolve-Path $env:STAGE_ROOT).Path
          iscc "/DAppVersion=$bareVersion" "/DSourceDir=$sourceDir" "installer\windows\gitspark.iss"
          if (-not (Test-Path $expectedOutput)) {
            Write-Error "Inno Setup did not produce expected output: $expectedOutput"
            exit 1
          }
          Move-Item $expectedOutput (Join-Path "dist" $setupName)
          Remove-Item -Recurse -Force $env:STAGE_ROOT

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      # README.md and the top-of-page download links point at these fixed
      # names via GitHub's /releases/latest/download/<name> alias, which
      # always resolves to whatever the newest non-prerelease release is.
      # The real per-version filenames (used by SHA256SUMS.txt and the
      # signed update manifest below) contain the tag, so a hardcoded link
      # to them would 404 the moment the next version ships. Copies, not
      # renames — the versioned originals still need to exist under their
      # own names for both of those.
      - name: Publish stable-named aliases for direct download links
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          cd dist
          alias_asset() {
            local source="$1" alias="$2"
            if [[ ! -f "$source" ]]; then
              echo "  $alias: source '$source' missing, skipping"
              return
            fi
            cp "$source" "$alias"
            echo "  $alias -> $source"
          }
          alias_asset "gitspark-${RELEASE_TAG}-universal2-apple-darwin.dmg" "gitspark-macos-universal.dmg"
          alias_asset "gitspark-${RELEASE_TAG}-x86_64-pc-windows-msvc-Setup.exe" "gitspark-windows-x64-Setup.exe"
          alias_asset "gitspark-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" "gitspark-linux-x64.tar.gz"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          # Same tag shape that picks the manifest channel below: a
          # pre-release identifier (v0.8.0-beta.1) means beta. Without this
          # a beta would land as a full GitHub release, and every "latest
          # release" link and download button would point users at it.
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
            echo "$RELEASE_TAG is a pre-release tag; marking the release accordingly"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              "${prerelease[@]}"
          fi

      # ------------------------------------------------------------------
      # Signed update manifest
      #
      # GitHub Releases stays the binary store; this publishes the signed
      # index the app actually reads. Clients never consult GitHub's "latest
      # release" endpoint, which only ever returns the newest NON-prerelease
      # and is therefore wrong for the beta channel by design.
      # ------------------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          path: repo
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sign-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sign-cargo-

      - name: Build manifest signing tool
        working-directory: repo
        run: cargo build --release --example update_sign

      - name: Verify the release key matches the key shipped in the app
        working-directory: repo
        env:
          GITSPARK_UPDATE_PRIVATE_KEY: ${{ secrets.GITSPARK_UPDATE_PRIVATE_KEY }}
          EXPECTED_PUBLIC_KEY: ${{ vars.GITSPARK_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # GitHub secrets are write-only, so this is the only place the pair
          # can be checked. A mismatch means every client would reject the
          # manifest — fail here, loudly, rather than shipping a dead update.
          echo '{}' > /tmp/keycheck.json
          actual="$(./target/release/examples/update_sign /tmp/keycheck.json 2>&1 \
            | sed -n 's/^public key: //p')"
          if [[ -z "$actual" ]]; then
            echo "signing tool did not report a public key" >&2
            exit 1
          fi
          if [[ "$actual" != "$EXPECTED_PUBLIC_KEY" ]]; then
            echo "::error::Release private key does not match the public key compiled into the app." >&2
            echo "  app expects: $EXPECTED_PUBLIC_KEY" >&2
            echo "  secret is:   $actual" >&2
            exit 1
          fi
          echo "release key matches the shipped public key"

      - name: Generate signed channel manifest
        working-directory: repo
        env:
          GITSPARK_UPDATE_PRIVATE_KEY: ${{ secrets.GITSPARK_UPDATE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          # Tag shape decides the channel: a pre-release identifier means beta.
          if [[ "$version" == *-* ]]; then channel="beta"; else channel="release"; fi
          echo "publishing $version to the $channel channel"

          base="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          dist="${GITHUB_WORKSPACE}/dist"

          # Build the assets map from what actually shipped. A platform whose
          # build failed is simply absent, and the client reports that as a
          # partial release rather than offering a download that 404s.
          assets="{}"
          add_asset() {
            local key="$1" file="$2"
            [[ -f "$dist/$file" ]] || { echo "  $key: missing, skipping"; return; }
            local sum size
            sum="$(sha256sum "$dist/$file" | cut -d' ' -f1)"
            size="$(stat -c%s "$dist/$file")"
            assets="$(jq --arg k "$key" --arg u "$base/$file" --arg s "$sum" --argjson z "$size" \
              '.[$k] = {url: $u, sha256: $s, size: $z}' <<<"$assets")"
            echo "  $key: $file"
          }

          add_asset "macos-universal" "gitspark-${RELEASE_TAG}-universal2-apple-darwin.dmg"
          add_asset "windows-x64"     "gitspark-${RELEASE_TAG}-x86_64-pc-windows-msvc.exe"
          add_asset "linux-x64"       "gitspark-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"

          if [[ "$(jq 'length' <<<"$assets")" -eq 0 ]]; then
            echo "::error::No release assets matched the expected names." >&2
            exit 1
          fi

          out="updates/${channel}"
          mkdir -p "$out"
          jq -n \
            --arg channel "$channel" \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes_url "https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}" \
            --argjson assets "$assets" \
            '{channel: $channel, version: $version, pub_date: $pub_date,
              notes: "", notes_url: $notes_url, assets: $assets}' \
            > "$out/latest.json"

          # Sign last: the signature covers the file byte for byte, so any
          # later rewrite would invalidate it.
          ./target/release/examples/update_sign "$out/latest.json"
          cat "$out/latest.json"

      - name: Publish manifest to GitHub Pages
        working-directory: repo
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage BEFORE testing for changes. `git diff` only reports tracked
          # files, so on the very first release — when updates/ does not exist
          # in the tree yet — it reports nothing and the manifest never
          # publishes. Comparing the index instead covers both the first run
          # and every later one. This is not hypothetical: it is exactly what
          # happened on v0.6.0.
          # --force because a blanket *.json rule in .gitignore silently
          # dropped latest.json on v0.6.1 while still committing its .sig,
          # publishing a signature with nothing to verify. The ignore rule is
          # fixed, but the release must not depend on it staying fixed.
          git add --force updates
          if git diff --cached --quiet -- updates; then
            echo "manifest unchanged, nothing to publish"
            exit 0
          fi
          # Both halves or neither. A partial publish is worse than no publish:
          # clients would fetch a manifest that fails verification, or a
          # signature for a manifest that is not there.
          for required in updates/*/latest.json updates/*/latest.json.sig; do
            if ! git diff --cached --name-only | grep -qx "$required"; then
              echo "::error::$required is missing from the manifest commit." >&2
              exit 1
            fi
          done
          # Pages serves the master branch root, so the manifest lands there.
          # [skip ci] keeps this from re-triggering the CI workflow.
          git commit -m "chore: publish update manifest for ${RELEASE_TAG} [skip ci]"
          # A release takes many minutes to build, and master can move in that
          # window. Rebase rather than losing the manifest to a race.
          git pull --rebase origin master
          git push origin master
