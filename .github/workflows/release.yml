name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: gitspark
  APP_DISPLAY_NAME: GitSpark
  MACOS_BUNDLE_ID: com.github.samro.gitspark
  PAGES_BASE_URL: https://jacobsamro.github.io/GitSpark

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_channel: ${{ steps.vars.outputs.release_channel }}
      version: ${{ steps.vars.outputs.version }}
      is_prerelease: ${{ steps.vars.outputs.is_prerelease }}
    steps:
      - name: Resolve release tag and channel
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "$tag" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          # Strip leading 'v' for the bare version string
          version="${tag#v}"

          # Infer channel: any pre-release suffix (e.g. -beta.1, -rc.2) → beta
          if [[ "$version" == *-* ]]; then
            channel="beta"
            is_prerelease="true"
          else
            channel="release"
            is_prerelease="false"
          fi

          echo "release_tag=$tag"           >> "$GITHUB_OUTPUT"
          echo "release_channel=$channel"   >> "$GITHUB_OUTPUT"
          echo "version=$version"           >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

          echo "Tag: $tag"
          echo "Version: $version"
          echo "Channel: $channel"
          echo "Pre-release: $is_prerelease"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: gitspark
            archive_ext: tar.gz
          - label: macos-universal
            os: macos-15
            target: universal2-apple-darwin
            binary: gitspark
            archive_ext: dmg
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: gitspark.exe
            archive_ext: zip
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

          mkdir -p target/universal2-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/${{ matrix.binary }} \
            target/aarch64-apple-darwin/release/${{ matrix.binary }} \
            -output target/universal2-apple-darwin/release/${{ matrix.binary }}
          lipo -info target/universal2-apple-darwin/release/${{ matrix.binary }}

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          archive_base="${APP_NAME}-${RELEASE_TAG}-${TARGET}"
          stage_root="dist/${archive_base}"
          mkdir -p "$stage_root"
          cp "target/${TARGET}/release/${BIN_NAME}" "$stage_root/"
          if [[ -f README.md ]]; then
            cp README.md "$stage_root/"
          fi
          tar -C dist -czf "dist/${archive_base}.${ARCHIVE_EXT}" "${archive_base}"
          rm -rf "$stage_root"

      - name: Package macOS app bundle and DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary }}
        run: |
          version="${RELEASE_TAG#v}"
          archive_base="${APP_NAME}-${RELEASE_TAG}-${TARGET}"
          app_bundle_name="${APP_DISPLAY_NAME}.app"
          bundle_root="dist/${archive_base}/${app_bundle_name}"
          contents_dir="${bundle_root}/Contents"
          macos_dir="${contents_dir}/MacOS"
          resources_dir="${contents_dir}/Resources"
          dmg_root="dist/dmg-root"

          mkdir -p "$macos_dir" "$resources_dir" "$dmg_root"
          cp "target/${TARGET}/release/${BIN_NAME}" "${macos_dir}/${BIN_NAME}"
          chmod +x "${macos_dir}/${BIN_NAME}"

          cat > "${contents_dir}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleExecutable</key>
            <string>${BIN_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>${MACOS_BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          cp -R "$bundle_root" "$dmg_root/"
          if [[ -f README.md ]]; then
            cp README.md "$dmg_root/"
          fi
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create \
            -volname "${APP_DISPLAY_NAME}" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "dist/${archive_base}.dmg"

          file "dist/${archive_base}.dmg"
          rm -rf "dist/${archive_base}" "$dmg_root"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary }}
        run: |
          $archiveBase = "$env:APP_NAME-$env:RELEASE_TAG-$env:TARGET"
          $stageRoot = Join-Path "dist" $archiveBase
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Copy-Item "target\$env:TARGET\release\$env:BIN_NAME" $stageRoot
          if (Test-Path README.md) {
            Copy-Item README.md $stageRoot
          }
          $archivePath = Join-Path "dist" "$archiveBase.zip"
          if (Test-Path $archivePath) {
            Remove-Item $archivePath
          }
          Compress-Archive -Path $stageRoot -DestinationPath $archivePath
          Remove-Item -Recurse -Force $stageRoot

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          prerelease_flag=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --prerelease
            fi
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              $prerelease_flag
          fi

  publish-metadata:
    name: Publish update metadata
    needs:
      - prepare
      - release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Initialize gh-pages if needed
        shell: bash
        run: |
          if [[ ! -d ".git" ]]; then
            git init
            git checkout --orphan gh-pages
            echo '<html><body><p>GitSpark update metadata</p></body></html>' > index.html
            git add index.html
          fi

      - name: Download checksums
        uses: actions/download-artifact@v5
        with:
          path: _artifacts
          merge-multiple: true

      - name: Generate channel metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          GH_REPO: ${{ github.repository }}
        run: |
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          notes_url="https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}"
          dl_base="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"

          # Parse SHA-256 checksums from the release artifacts
          linux_archive="${APP_NAME}-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          windows_archive="${APP_NAME}-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
          macos_archive="${APP_NAME}-${RELEASE_TAG}-universal2-apple-darwin.dmg"

          linux_sha=""
          windows_sha=""
          macos_sha=""

          if [[ -f "_artifacts/SHA256SUMS.txt" ]]; then
            linux_sha=$(grep "${linux_archive}" "_artifacts/SHA256SUMS.txt" | awk '{print $1}' || true)
            windows_sha=$(grep "${windows_archive}" "_artifacts/SHA256SUMS.txt" | awk '{print $1}' || true)
            macos_sha=$(grep "${macos_archive}" "_artifacts/SHA256SUMS.txt" | awk '{print $1}' || true)
          fi

          # Create latest.json for this channel
          mkdir -p "updates/${CHANNEL}"
          cat > "updates/${CHANNEL}/latest.json" <<MANIFEST
          {
            "channel": "${CHANNEL}",
            "version": "${VERSION}",
            "pub_date": "${pub_date}",
            "notes_url": "${notes_url}",
            "assets": {
              "linux-x64": {
                "url": "${dl_base}/${linux_archive}",
                "sha256": "${linux_sha}"
              },
              "windows-x64": {
                "url": "${dl_base}/${windows_archive}",
                "sha256": "${windows_sha}"
              },
              "macos-universal": {
                "url": "${dl_base}/${macos_archive}",
                "sha256": "${macos_sha}"
              }
            }
          }
          MANIFEST

          echo "Generated updates/${CHANNEL}/latest.json"
          cat "updates/${CHANNEL}/latest.json"

      - name: Generate Sparkle appcast
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.release_channel }}
          GH_REPO: ${{ github.repository }}
        run: |
          pub_date=$(date -u -R)
          dl_base="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          macos_archive="${APP_NAME}-${RELEASE_TAG}-universal2-apple-darwin.dmg"
          macos_url="${dl_base}/${macos_archive}"

          sparkle_channel=""
          if [[ "$CHANNEL" == "beta" ]]; then
            sparkle_channel='<sparkle:channel>beta</sparkle:channel>'
          fi

          mkdir -p sparkle

          # Build a new item entry
          new_item=$(cat <<ITEM
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${pub_date}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                ${sparkle_channel}
                <link>https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}</link>
                <enclosure
                  url="${macos_url}"
                  type="application/octet-stream"
                />
              </item>
          ITEM
          )

          # If an existing appcast exists, insert the new item
          if [[ -f sparkle/appcast.xml ]]; then
            # Insert before </channel>
            sed -i "s|</channel>|${new_item}\n    </channel>|" sparkle/appcast.xml
          else
            cat > sparkle/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="http://www.andymatuschak.net/xml-namespaces/sparkle">
            <channel>
              <title>${APP_DISPLAY_NAME}</title>
              ${new_item}
            </channel>
          </rss>
          APPCAST
          fi

          echo "Generated sparkle/appcast.xml"
          cat sparkle/appcast.xml

      - name: Commit and push metadata
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.release_channel }}
        run: |
          rm -rf _artifacts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/ sparkle/ index.html
          git commit -m "Update ${CHANNEL} metadata for v${VERSION}" || echo "No changes to commit"
          git push origin gh-pages || echo "Push failed — gh-pages branch may need to be created manually"
