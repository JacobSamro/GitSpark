# Local Gitea instance for the "real HTTP remote" e2e suite
# (e2e/gitea-suite.mjs). Not part of the default e2e run — this is opt-in,
# for exercising push/pull/fetch/clone against a live git server instead of
# a local bare repo.
#
# Usage:
#   docker compose -f docker-compose.gitea.yml up -d
#   node e2e/gitea-suite.mjs
#   docker compose -f docker-compose.gitea.yml down
#
# No named volume on purpose: every `up` starts from an empty Gitea so the
# suite always runs against known-clean state. Port 3050 is used instead of
# Gitea's default 3000 (and 3306/8080 avoided) to sidestep collisions with
# other local containers.
services:
  gitea:
    image: gitea/gitea:1.22
    environment:
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3050/
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__log__LEVEL=Warn
    ports:
      - "3050:3000"
